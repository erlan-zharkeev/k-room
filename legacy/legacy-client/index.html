<!DOCTYPE html>
<html lang="en" theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/style/theme.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="msapplication-TileColor" content="__THEME_BG__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/meta/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/meta/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/meta/favicon-16x16.png" />
    <link rel="mask-icon" href="/meta/safari-pinned-tab.svg" color="__THEME_BG__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>__APP_NAME__</title>
  </head>

  <body class="k-room-app">
    <div id="root"></div>

    <div id="app-loader" class="app-loader" aria-busy="true" aria-live="polite">
      <div class="app-progressbar">
        <div class="app-progressbar-inner"></div>
      </div>
    </div>

    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--main-bg);
        z-index: 9999;
      }

      .app-loader--hide {
        opacity: 0;
        transition: 0.3s ease-in-out;
        pointer-events: none;
      }

      .app-progressbar {
        position: relative;
        width: 200px;
        height: 4px;
        background: var(--shadow-outset-start);
        overflow: hidden;
        border-radius: 2px;
      }

      .app-progressbar-inner {
        position: absolute;
        left: -50%;
        width: 50%;
        height: 100%;
        background: var(--accent);
        animation: progress-slide 1s infinite ease-in-out;
      }

      @keyframes progress-slide {
        0% {
          left: -50%;
          width: 50%;
        }
        50% {
          left: 25%;
          width: 30%;
        }
        100% {
          left: 100%;
          width: 50%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-progressbar-inner {
          animation: none;
          width: 100%;
          left: 0;
        }
      }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
