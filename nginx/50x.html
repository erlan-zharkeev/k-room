<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K-Room is temporarily unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #111517;
        color: #d7e0e4;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111517;
      }

      main {
        width: min(100% - 2rem, 34rem);
        text-align: center;
      }

      .brand {
        display: inline-grid;
        place-items: center;
        width: 4rem;
        height: 4rem;
        margin-bottom: 1.5rem;
        border-radius: 0.5rem;
        background: #147fd7;
        color: #0b1013;
        font-size: 2rem;
        font-weight: 800;
        line-height: 1;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #94a4ac;
        font-size: 1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">K</div>
      <h1>Service temporarily unavailable</h1>
      <p>Something went wrong on our side. Please refresh the page in a moment.</p>
    </main>
  </body>
</html>
