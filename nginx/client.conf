server {
  listen 80;
  server_name _;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/x-javascript application/xml image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @asset_history_fallback;
  }

  location @asset_history_fallback {
    internal;
    root /usr/share/nginx/asset-history/fallback;
    try_files $uri =404;
  }

  location /downloads/ {
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
