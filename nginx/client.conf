server {
  listen 80;
  server_name _;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json application/x-javascript application/xml image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  location /downloads/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
