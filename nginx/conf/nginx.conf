server {
    listen 80;
    listen [::]:80;

    server_name http_server;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uncomment while generate ssl cert
    # location / {
    #     return 301 https://$host$request_uri
    # }

    # comment next block for generate ssl cert
    location / {
        proxy_pass http://client:3001/;
        # proxy_pass http://server:3000/;
    }
}

server {
    listen 443 k-room.space ssl http2;
    listen [::]:443 ssl http2;

    server_name https_server;

    ssl_certificate /etc/nginx/ssl/live/k-room.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/k-room.space/privkey.pem;

    location / {
        proxy_pass http://client:3001/;
        # proxy_pass http://server:3000/;
    }
}

server {
    listen 3000;
    listen [::]:3000;

    server_name https_api_server;

    ssl_certificate /etc/nginx/ssl/live/k-room.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/k-room.space/privkey.pem;

    location / {
        # proxy_pass http://client:3001/;
        proxy_pass http://server:3000/;
    }
}
