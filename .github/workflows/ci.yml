name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.14.0'
  PNPM_VERSION: '10.33.0'
  CLIENT_IMAGE_NAME: erlan1/k-room_client
  SERVER_IMAGE_NAME: erlan1/k-room_server

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

  publish-images:
    name: Publish Docker Images
    needs: verify
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          docker build -t "${CLIENT_IMAGE_NAME}:latest" -t "${CLIENT_IMAGE_NAME}:${SHORT_SHA}" -f ./client/Dockerfile ./
          docker build -t "${SERVER_IMAGE_NAME}:latest" -t "${SERVER_IMAGE_NAME}:${SHORT_SHA}" -f ./server/Dockerfile ./

          docker push "${CLIENT_IMAGE_NAME}:latest"
          docker push "${CLIENT_IMAGE_NAME}:${SHORT_SHA}"
          docker push "${SERVER_IMAGE_NAME}:latest"
          docker push "${SERVER_IMAGE_NAME}:${SHORT_SHA}"

  deploy-production:
    name: Deploy Production
    needs: publish-images
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/production'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" ]; then
            echo "LIGHTSAIL_SSH_PRIVATE_KEY_B64 is empty" >&2
            exit 1
          fi

          if [ -z "$LIGHTSAIL_HOST" ]; then
            echo "LIGHTSAIL_HOST is empty" >&2
            exit 1
          fi

          if [[ "$LIGHTSAIL_HOST" =~ [[:space:]\"\'] ]]; then
            echo "LIGHTSAIL_HOST must contain only host value without spaces or quotes" >&2
            exit 1
          fi

          echo "SSH target host: $LIGHTSAIL_HOST"
          echo "SSH target user: $LIGHTSAIL_USER"
          echo "SSH target port: 22"
          echo "Runner public IPv4:"
          curl -fsS https://api.ipify.org || true
          echo
          echo "Host resolution:"
          getent ahosts "$LIGHTSAIL_HOST" || true

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" | base64 --decode | tr -d '\r' > ~/.ssh/id_ed25519; then
            echo "LIGHTSAIL_SSH_PRIVATE_KEY_B64 must contain base64 of the private SSH key file" >&2
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          echo "Testing TCP connection to $LIGHTSAIL_HOST:22"
          if ! timeout 20 bash -c 'cat < /dev/null > /dev/tcp/"$1"/22' _ "$LIGHTSAIL_HOST"; then
            echo "Could not connect to LIGHTSAIL_HOST port 22 from GitHub Actions." >&2
            exit 1
          fi

          echo "Reading SSH host key from $LIGHTSAIL_HOST"
          if ! ssh-keyscan -T 20 -v -H "$LIGHTSAIL_HOST" > ~/.ssh/known_hosts 2> ~/.ssh/ssh-keyscan.log; then
            cat ~/.ssh/ssh-keyscan.log >&2
            echo "Could not read SSH host key. Check LIGHTSAIL_HOST value and that port 22 is open for GitHub Actions." >&2
            exit 1
          fi
          cat ~/.ssh/ssh-keyscan.log

      - name: Restore production secret env
        env:
          ENV_SECRET_B64: ${{ secrets.ENV_SECRET_B64 }}
        run: |
          if [ -n "$ENV_SECRET_B64" ]; then
            printf '%s' "$ENV_SECRET_B64" | base64 --decode > .env.secret
          fi

      - name: Copy deployment files
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_APP_PATH: ${{ secrets.LIGHTSAIL_APP_PATH }}
        run: |
          SSH_OPTIONS=(-o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes -o ConnectTimeout=30)

          ssh "${SSH_OPTIONS[@]}" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "mkdir -p $LIGHTSAIL_APP_PATH/scripts/deploy $LIGHTSAIL_APP_PATH/nginx $LIGHTSAIL_APP_PATH/scripts/deploy/certs"

          scp "${SSH_OPTIONS[@]}" compose.prod.yml "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/compose.prod.yml"
          scp "${SSH_OPTIONS[@]}" .env.shared "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/.env.shared"
          scp "${SSH_OPTIONS[@]}" .env.production "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/.env.production"
          scp "${SSH_OPTIONS[@]}" scripts/deploy/deploy.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/deploy.sh"
          scp "${SSH_OPTIONS[@]}" scripts/deploy/sync-certs.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/sync-certs.sh"
          scp "${SSH_OPTIONS[@]}" scripts/deploy/install-certbot-renew-hook.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/install-certbot-renew-hook.sh"
          scp "${SSH_OPTIONS[@]}" nginx/webserver.conf "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/nginx/webserver.conf"

          if [ -f .env.secret ]; then
            scp "${SSH_OPTIONS[@]}" .env.secret "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/.env.secret"
          fi

      - name: Run deployment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_APP_PATH: ${{ secrets.LIGHTSAIL_APP_PATH }}
        run: |
          SSH_OPTIONS=(-o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes -o ConnectTimeout=30)

          ssh "${SSH_OPTIONS[@]}" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "cd $LIGHTSAIL_APP_PATH && DOCKERHUB_USERNAME=\"$DOCKERHUB_USERNAME\" DOCKERHUB_TOKEN=\"$DOCKERHUB_TOKEN\" sh ./scripts/deploy/deploy.sh"
