name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.14.0'
  PNPM_VERSION: '10.33.0'
  CLIENT_IMAGE_NAME: erlan1/k-room_client
  SERVER_IMAGE_NAME: erlan1/k-room_server
  VPS_USER: root
  VPS_APP_PATH: /opt/k-room

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        env:
          FIREBASE_API_KEY: ci-firebase-api-key
        run: pnpm run check

  build-desktop-installers:
    name: Build Desktop Installers (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && startsWith(github.event.head_commit.message, 'deploy(production):')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows
            os: windows-latest
            rust_targets: ''
            tauri_args: ''
          - name: macOS
            platform: macos
            os: macos-15-intel
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust with targets
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --dir global-shared run build

      - name: Restore production secret env
        shell: bash
        env:
          ENV_SECRET_B64: ${{ secrets.ENV_SECRET_B64 }}
        run: |
          if [ -n "$ENV_SECRET_B64" ]; then
            printf '%s' "$ENV_SECRET_B64" | base64 --decode > .env.secret
          fi

      - name: Load desktop signing env
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          read_env_value() {
            file_path="$1"
            key="$2"

            if [ ! -f "$file_path" ]; then
              return
            fi

            grep -m 1 "^$key=" "$file_path" | cut -d '=' -f 2- | sed "s/^'//; s/'$//; s/^\"//; s/\"$//" || true
          }

          write_github_env() {
            key="$1"
            value="$2"
            delimiter="${key}_EOF"

            if [ -z "$value" ]; then
              return
            fi

            echo "::add-mask::$value"
            {
              echo "$key<<$delimiter"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            TAURI_SIGNING_PRIVATE_KEY="$(read_env_value .env.secret TAURI_SIGNING_PRIVATE_KEY)"
          fi

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$(read_env_value .env.secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD)"
          fi

          write_github_env TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
          write_github_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Validate updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to build signed updater artifacts." >&2
            exit 1
          fi

      - name: Build Tauri installer
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && '-' || '' }}
          DESKTOP_PLATFORM: ${{ matrix.platform }}
          TAURI_BUILD_ARGS: ${{ matrix.tauri_args }}
        run: |
          pnpm --dir client run check:version

          set +e
          set -o pipefail

          build_log_path="${RUNNER_TEMP:-.}/tauri-build.log"

          run_tauri_build() {
            if [ -n "$TAURI_BUILD_ARGS" ]; then
              pnpm --dir client exec tauri build $TAURI_BUILD_ARGS 2>&1 | tee "$build_log_path"

              return "${PIPESTATUS[0]}"
            fi

            pnpm --dir client exec tauri build 2>&1 | tee "$build_log_path"

            return "${PIPESTATUS[0]}"
          }

          cleanup_macos_dmg_state() {
            if command -v hdiutil >/dev/null 2>&1; then
              hdiutil info | awk '/\/Volumes\/K-Room/ { print $1 }' | while read -r device; do
                hdiutil detach "$device" -force || true
              done
            fi

            rm -rf client/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          }

          run_tauri_build
          build_status="$?"

          if [ "$build_status" -ne 0 ] && [ "$DESKTOP_PLATFORM" = "macos" ]; then
            echo "macOS Tauri bundle failed; cleaning DMG state and retrying once."
            cleanup_macos_dmg_state
            run_tauri_build
            build_status="$?"
          fi

          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi

          log_tail="$(tail -120 "$build_log_path" || true)"
          log_tail="${log_tail//%/%25}"
          log_tail="${log_tail//$'\r'/%0D}"
          log_tail="${log_tail//$'\n'/%0A}"
          echo "::error title=Tauri build failed::$log_tail"
          exit "$build_status"

      - name: Prepare desktop download artifact
        run: node scripts/desktop/prepare-desktop-download-artifact.mjs ${{ matrix.platform }}

      - name: Upload desktop download artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-downloads-${{ matrix.platform }}
          path: .desktop-downloads/${{ matrix.platform }}
          if-no-files-found: error

  publish-images:
    name: Publish Docker Images
    needs:
      - verify
      - build-desktop-installers
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && startsWith(github.event.head_commit.message, 'deploy(production):')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-downloads-*
          path: .desktop-downloads
          merge-multiple: true

      - name: Stage desktop downloads
        run: node scripts/desktop/finalize-desktop-downloads.mjs

      - name: Show staged desktop downloads
        run: find client/public/downloads -maxdepth 3 -type f -print

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore production secret env
        env:
          ENV_SECRET_B64: ${{ secrets.ENV_SECRET_B64 }}
        run: |
          if [ -n "$ENV_SECRET_B64" ]; then
            printf '%s' "$ENV_SECRET_B64" | base64 --decode > .env.secret
          fi

      - name: Build and push images
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail

          read_env_value() {
            file_path="$1"
            key="$2"

            if [ ! -f "$file_path" ]; then
              return
            fi

            grep -m 1 "^$key=" "$file_path" | cut -d '=' -f 2- | sed "s/^'//; s/'$//; s/^\"//; s/\"$//" || true
          }

          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            FIREBASE_API_KEY="$(read_env_value .env.secret FIREBASE_API_KEY)"
          fi

          if [ -z "${FIREBASE_API_KEY:-}" ]; then
            FIREBASE_API_KEY="$(read_env_value .env.production FIREBASE_API_KEY)"
          fi

          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "FIREBASE_API_KEY is required for the production client image." >&2
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          docker build \
            --build-arg FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            -t "${CLIENT_IMAGE_NAME}:latest" \
            -t "${CLIENT_IMAGE_NAME}:${SHORT_SHA}" \
            -f ./client/Dockerfile ./
          docker build -t "${SERVER_IMAGE_NAME}:latest" -t "${SERVER_IMAGE_NAME}:${SHORT_SHA}" -f ./server/Dockerfile ./

          docker push "${CLIENT_IMAGE_NAME}:latest"
          docker push "${CLIENT_IMAGE_NAME}:${SHORT_SHA}"
          docker push "${SERVER_IMAGE_NAME}:latest"
          docker push "${SERVER_IMAGE_NAME}:${SHORT_SHA}"

  deploy-production:
    name: Deploy Production
    needs: publish-images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' && startsWith(github.event.head_commit.message, 'deploy(production):')
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$VPS_SSH_PRIVATE_KEY_B64" ]; then
            echo "VPS_SSH_PRIVATE_KEY_B64 is empty" >&2
            exit 1
          fi

          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST is empty" >&2
            exit 1
          fi

          if [[ "$VPS_HOST" =~ [[:space:]\"\'] ]]; then
            echo "VPS_HOST must contain only host value without spaces or quotes" >&2
            exit 1
          fi

          echo "SSH target host: $VPS_HOST"
          echo "SSH target user: $VPS_USER"
          echo "SSH target port: 22"
          echo "Runner public IPv4:"
          curl -fsS https://api.ipify.org || true
          echo
          echo "Host resolution:"
          getent ahosts "$VPS_HOST" || true

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if ! printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 --decode | tr -d '\r' > ~/.ssh/id_ed25519; then
            echo "VPS_SSH_PRIVATE_KEY_B64 must contain base64 of the private SSH key file" >&2
            exit 1
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          echo "SSH key fingerprint:"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          echo "Testing TCP connection to $VPS_HOST:22"
          if ! timeout 20 bash -c 'cat < /dev/null > /dev/tcp/"$1"/22' _ "$VPS_HOST"; then
            echo "Could not connect to VPS_HOST port 22 from GitHub Actions." >&2
            exit 1
          fi

          echo "Reading SSH host key from $VPS_HOST"
          if ! ssh-keyscan -T 20 -v -H "$VPS_HOST" > ~/.ssh/known_hosts 2> ~/.ssh/ssh-keyscan.log; then
            cat ~/.ssh/ssh-keyscan.log >&2
            echo "Could not read SSH host key. Check VPS_HOST value and that port 22 is open for GitHub Actions." >&2
            exit 1
          fi
          cat ~/.ssh/ssh-keyscan.log

      - name: Restore production secret env
        env:
          ENV_SECRET_B64: ${{ secrets.ENV_SECRET_B64 }}
        run: |
          if [ -n "$ENV_SECRET_B64" ]; then
            printf '%s' "$ENV_SECRET_B64" | base64 --decode > .env.secret
          fi

      - name: Copy deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          SSH_OPTIONS=(-o ServerAliveInterval=60 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          DEPLOY_FILES=(
            compose.prod.yml
            .env.shared
            .env.production
            scripts/deploy/deploy.sh
            scripts/deploy/sync-certs.sh
            nginx/50x.html
            nginx/webserver.conf
          )

          if [ -f .env.secret ]; then
            DEPLOY_FILES+=(.env.secret)
          fi

          tar -czf - "${DEPLOY_FILES[@]}" | ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p $VPS_APP_PATH/scripts/deploy/certs $VPS_APP_PATH/nginx && tar -xzf - -C $VPS_APP_PATH"

      - name: Run deployment
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          SSH_OPTIONS=(-o ServerAliveInterval=60 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)

          ssh "${SSH_OPTIONS[@]}" "$VPS_USER@$VPS_HOST" "cd $VPS_APP_PATH && DOCKERHUB_USERNAME=\"$DOCKERHUB_USERNAME\" DOCKERHUB_TOKEN=\"$DOCKERHUB_TOKEN\" sh ./scripts/deploy/deploy.sh"
