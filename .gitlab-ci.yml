stages:
  - verify
  - test
  - publish-images
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

variables:
  NODE_VERSION: '24.14.0'
  DOCKER_VERSION: '27.5.1'
  DOCKER_TLS_CERTDIR: '/certs'
  DOCKER_HOST: 'tcp://docker:2376'
  DOCKER_TLS_VERIFY: '1'
  DOCKER_CERT_PATH: '$DOCKER_TLS_CERTDIR/client'
  CLIENT_IMAGE_NAME: 'ketjo/k-room_client'
  SERVER_IMAGE_NAME: 'ketjo/k-room_server'

verify:
  image: node:${NODE_VERSION}
  stage: verify
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run check

publish-images:
  image: docker:${DOCKER_VERSION}
  stage: publish-images
  services:
    - docker:${DOCKER_VERSION}-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success
    - when: never
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t ${CLIENT_IMAGE_NAME}:latest -t ${CLIENT_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -f ./client/Dockerfile ./
    - docker build -t ${SERVER_IMAGE_NAME}:latest -t ${SERVER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -f ./server/Dockerfile ./
    - docker push ${CLIENT_IMAGE_NAME}:latest
    - docker push ${CLIENT_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${SERVER_IMAGE_NAME}:latest
    - docker push ${SERVER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

deploy-production:
  image: alpine:3.21
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: manual
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
    - ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST"
      "mkdir -p $LIGHTSAIL_APP_PATH/scripts/deploy $LIGHTSAIL_APP_PATH/nginx $LIGHTSAIL_APP_PATH/scripts/deploy/certs"
    - scp compose.prod.yml "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/compose.prod.yml"
    - scp .env.common "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/.env.common"
    - scp .env.production "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/.env.production"
    - scp scripts/deploy/deploy.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/deploy.sh"
    - scp scripts/deploy/sync-certs.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/sync-certs.sh"
    - scp scripts/deploy/install-certbot-renew-hook.sh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/scripts/deploy/install-certbot-renew-hook.sh"
    - scp nginx/webserver.conf "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$LIGHTSAIL_APP_PATH/nginx/webserver.conf"
    - >
      ssh "$LIGHTSAIL_USER@$LIGHTSAIL_HOST"
      "cd $LIGHTSAIL_APP_PATH
      && DOCKERHUB_USERNAME=\"$DOCKERHUB_USERNAME\" DOCKERHUB_TOKEN=\"$DOCKERHUB_TOKEN\" sh ./scripts/deploy/deploy.sh"
