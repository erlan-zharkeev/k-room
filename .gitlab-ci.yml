image: docker:20.10

stages:
  - publish-images
  - deploy

services:
  - docker:dind

publish-images:
  stage: publish-images
  script:
    - docker login -u ketjo -p $DOCKERHUB_TOKEN
    - echo "K_ROOM_ACCESS_TOKEN_SECRET=$K_ROOM_ACCESS_TOKEN_SECRET" >> ./server/.env.production
    - echo "K_ROOM_REFRESH_TOKEN_SECRET=$K_ROOM_REFRESH_TOKEN_SECRET" >> ./server/.env.production
    - echo "K_ROOM_MAIL_PASS=$K_ROOM_MAIL_PASS" >> ./server/.env.production
    - echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> ./client/.env.production
    - cat ./client/.env.production
    - docker build -t ketjo/k-room_client:latest -f ./client/Dockerfile ./
    - docker build -t ketjo/k-room_server:latest -f ./server/Dockerfile ./
    - docker push ketjo/k-room_server:latest
    - docker push ketjo/k-room_client:latest
  only:
    - main

deploy:
  stage: deploy
  before_script:
    - command -v ssh-agent >/dev/null || (apk add --update openssh)
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" > aws.pem
    - chmod 600 aws.pem
    - ssh-add aws.pem
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$EC2_IPADDRESS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scp -i aws.pem -r deploy $AWS_USER@$EC2_IPADDRESS:./app
    - |
      for name in deploy_server_1 deploy_client_1 deploy_webserver_1; do
        if [ ! -z "$(docker ps -a -q -f name=$name)" ]; then
          docker stop $name
          docker rm $name
          echo "!Container - $name - deleted!"
        fi
      done
    - |
      for image in ketjo/k-room_server:latest ketjo/k-room_client:latest; do
        if [ ! -z "$(docker images -q $image)" ]; then
          docker rmi $image
        fi
      done
    - ssh -i aws.pem $AWS_USER@$EC2_IPADDRESS "
      docker login -u ketjo -p $DOCKERHUB_TOKEN &&
      docker pull ketjo/k-room_server:latest  &&
      docker pull ketjo/k-room_client:latest &&
      docker-compose -f ./app/deploy/docker-compose-prod.yml build &&
      docker-compose restart"
  only:
    - main