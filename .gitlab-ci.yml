variables:
  SERVER_IMAGE: ketjo/k-room_server
  CLIENT_IMAGE: ketjo/k-room_client

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker-compose build
  only:
    - main
  artifacts:
    paths:
      - server   # Путь к сборке серверного образа
      - client   # Путь к сборке клиентского образа

publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
    - docker load -i server    # Загрузка серверного образа из артефактов
    - docker load -i client    # Загрузка клиентского образа из артефактов
    - docker tag ${SERVER_IMAGE}:latest ${SERVER_IMAGE}:${CI_COMMIT_SHA}
    - docker tag ${CLIENT_IMAGE}:latest ${CLIENT_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${SERVER_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${CLIENT_IMAGE}:${CI_COMMIT_SHA}
  only:
    - main
