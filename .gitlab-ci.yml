deploy:
  stage: deploy
  before_script:
    - command -v ssh-agent >/dev/null || (apk add --update openssh)
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" > aws.pem
    - chmod 600 aws.pem
    - ssh-add aws.pem
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$EC2_IPADDRESS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - scp -i aws.pem -r deploy $AWS_USER@$EC2_IPADDRESS:./app
    - ssh -i aws.pem $AWS_USER@$EC2_IPADDRESS "
      sudo docker stop $(docker ps -aq) &&
      sudo docker rm $(docker ps -aq) &&
      sudo docker volume prune -f &&
      sudo docker rmi $(docker images -a -q) &&
      sudo docker pull ketjo/k-room_server:latest &&
      sudo docker pull ketjo/k-room_client:latest &&
      sudo docker login -u ketjo -p $DOCKERHUB_TOKEN &&
      sudo docker-compose -f ./app/deploy/docker-compose-prod.yml up -d --remove-orphans"
  only:
    - main