server {
    listen 80;
    listen [::]:80;

    server_name k-room.space;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

server {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name k-room.space;

    ssl_certificate /etc/nginx/ssl/live/k-room.space/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/k-room.space/privkey.pem;

    location /api/ {
        proxy_pass http://server:3000/api/;
    }

    location /app-socket/ {
        proxy_pass http://server:3000/app-socket/;
    }

    location / {
        proxy_pass http://client:3001/;
    }
}