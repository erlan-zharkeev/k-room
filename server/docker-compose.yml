version: '3'

services:
  app:
    container_name: 'k-room-main'
    restart: always
    build: .
    ports:
      - '3000:3000'
    links:
      - 'mongodb'
  mongodb:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro


