services:
  client:
    image: ketjo/k-room_client:latest
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  server:
    image: ketjo/k-room_server:latest
    restart: unless-stopped
    env_file:
      - path: ./.env.production
        required: true
      - path: ./.env.runtime
        required: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const socket=require('node:net').connect(3000,'127.0.0.1');socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'echo "db.runCommand({ ping: 1 }).ok" | mongosh --quiet mongodb://127.0.0.1:27017/admin | grep 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_ADMIN_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_ADMIN_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_ADMIN_MONGODB_URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  webserver:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
      mongo-express:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx/webserver.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongo-data:
