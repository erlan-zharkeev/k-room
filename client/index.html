<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="__THEME_BG__" />
    <link rel="apple-touch-icon" sizes="180x180" href="/meta/apple-touch-icon.png" />
    <link rel="icon" href="/meta/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/meta/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/meta/favicon-16x16.png" />
    <link rel="mask-icon" href="/meta/safari-pinned-tab.svg" color="__THEME_BG__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        overflow: hidden;
        height: 100%;
        min-height: 0;
        margin: 0;
        background: __THEME_BG__;
      }

      body {
        min-width: 320px;
        height: 100dvh;
        padding: 8px;
      }

      .app-bootstrap-loader {
        isolation: isolate;
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        height: 100%;
        min-height: 0;
        background: __THEME_BG__;
      }

      .app-bootstrap-loader__dots {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .app-bootstrap-loader__dot {
        aspect-ratio: 1;
        width: 8px;
        border-radius: 50%;
        opacity: 0.34;
        background: #4a90e2;
        animation: app-bootstrap-loader-pulse 840ms ease-in-out infinite;
      }

      .app-bootstrap-loader__dot--second {
        animation-delay: 120ms;
      }

      .app-bootstrap-loader__dot--third {
        animation-delay: 240ms;
      }

      @keyframes app-bootstrap-loader-pulse {
        50% {
          transform: translateY(-4px);
          opacity: 1;
        }

        100% {
          opacity: 0.34;
        }
      }
    </style>
    <title>__APP_NAME__</title>
  </head>
  <body>
    <div id="app">
      <div class="app-bootstrap-loader" aria-busy="true">
        <div class="app-bootstrap-loader__dots">
          <span class="app-bootstrap-loader__dot"></span>
          <span class="app-bootstrap-loader__dot app-bootstrap-loader__dot--second"></span>
          <span class="app-bootstrap-loader__dot app-bootstrap-loader__dot--third"></span>
        </div>
      </div>
    </div>
    <script>
      window.__K_ROOM_CLIENT_RECOVERY_CONFIG__ =
        typeof __CLIENT_RECOVERY_CONFIG__ === 'undefined' ? { enabled: false } : __CLIENT_RECOVERY_CONFIG__
    </script>
    <script src="/client-recovery.js"></script>
    __SERVICE_WORKER_REGISTER_SCRIPT__
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
