version: '3'

services:
  db:
    image: mongo:latest
    container_name: db
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  server:
    image: ketjo/k-room_server:latest
    restart: always
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
  client:
    image: ketjo/k-room_client:latest
    restart: always
    build:
      context: ./
      dockerfile: ./client/Dockerfile
    ports:
      - '${CLIENT_PORT}:${CLIENT_PORT}'