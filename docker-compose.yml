  client:
    container_name: 'k-room-client'
    restart: always
    build:
      context: ./
      dockerfile: ./client/Dockerfile
    ports:
      - '3001:3001'
  nginx:
    container_name: nginx
    restart: unless-stopped
    image: nginx
    ports:
        - 80:80
        - 443:443
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email erlan.zharkeeev@gmail.com -d k-room.space --agree-tos