version: '3'

services:
  db:
    container_name: k-room-db
    restart: always
    build: ./db/
    ports:
      - 27017:27017
    volumes:
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  client:
    container_name: 'k-room-client'
    restart: always
    build: ./client/
    ports:
      - '3001:3001'
  server:
    container_name: 'k-room-server'
    restart: always
    build: ./server/
    ports:
      - '3000:3000'
    links:
      - 'k-room-db'
